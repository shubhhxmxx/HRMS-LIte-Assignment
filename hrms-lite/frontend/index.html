<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Lite - Employee Management System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0e17;
            --color-surface: #141821;
            --color-surface-hover: #1a1f2e;
            --color-border: #252938;
            --color-text: #e4e6eb;
            --color-text-dim: #9194a1;
            --color-text-dimmer: #6b6e7a;
            --color-primary: #00d9ff;
            --color-primary-glow: rgba(0, 217, 255, 0.15);
            --color-secondary: #7c3aed;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-accent: #ff006e;
            --font-display: 'Darker Grotesque', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px var(--color-primary-glow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-display);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 110, 0.04) 0%, transparent 50%);
            animation: bgShift 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(2deg); }
        }

        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(20, 24, 33, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: white;
            box-shadow: var(--shadow-glow);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 217, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.5); }
        }

        .logo-text h1 {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--color-text-dim);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 0.5rem;
            background: var(--color-surface);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--color-border);
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            background: transparent;
            color: var(--color-text-dim);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            color: var(--color-text);
            background: var(--color-surface-hover);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
            box-shadow: var(--shadow-glow);
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .page-header {
            margin-bottom: 3rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .page-subtitle {
            color: var(--color-text-dim);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Dashboard Cards */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: scaleIn 0.4s ease-out;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--color-primary);
        }

        .stat-label {
            color: var(--color-text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            flex: 1;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-glow);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--color-text);
            font-family: var(--font-display);
            font-size: 1rem;
            outline: none;
            flex: 1;
            margin-left: 0.75rem;
        }

        .search-icon {
            color: var(--color-text-dim);
        }

        /* Buttons */
        .btn {
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 12px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.4);
        }

        .btn-secondary {
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            background: var(--color-surface-hover);
            border-color: var(--color-primary);
        }

        .btn-danger {
            background: var(--color-danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* Table */
        .table-container {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 217, 255, 0.05);
            border-bottom: 1px solid var(--color-border);
        }

        th {
            padding: 1.25rem 1.5rem;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--color-text-dim);
        }

        td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: var(--color-surface-hover);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-present {
            background: rgba(16, 185, 129, 0.15);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }

        .badge-absent {
            background: rgba(239, 68, 68, 0.15);
            color: var(--color-danger);
            border: 1px solid var(--color-danger);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.4s ease-out;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--color-text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: var(--color-text);
            transform: rotate(90deg);
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            color: var(--color-text);
            font-family: var(--font-display);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-glow);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Loading and Empty States */
        .loading, .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-dim);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Alert */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--color-danger);
            color: var(--color-danger);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--color-success);
            color: var(--color-success);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1.5rem;
            }

            .nav {
                width: 100%;
            }

            .page-title {
                font-size: 2rem;
            }

            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuration
        const API_URL = 'https://hrms-lite-api.onrender.com/api';

        // Main App Component
        function App() {
            const [currentView, setCurrentView] = useState('dashboard');
            const [employees, setEmployees] = useState([]);
            const [attendance, setAttendance] = useState([]);
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [showEmployeeModal, setShowEmployeeModal] = useState(false);
            const [showAttendanceModal, setShowAttendanceModal] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                fetchData();
            }, [currentView]);

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    if (currentView === 'dashboard') {
                        const res = await fetch(`${API_URL}/dashboard/stats`);
                        const data = await res.json();
                        setStats(data);
                    } else if (currentView === 'employees') {
                        const res = await fetch(`${API_URL}/employees`);
                        const data = await res.json();
                        setEmployees(data);
                    } else if (currentView === 'attendance') {
                        const res = await fetch(`${API_URL}/attendance`);
                        const data = await res.json();
                        setAttendance(data);
                    }
                } catch (err) {
                    setError('Failed to fetch data. Please try again.');
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            const addEmployee = async (employeeData) => {
                try {
                    const res = await fetch(`${API_URL}/employees`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(employeeData)
                    });
                    
                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.detail || 'Failed to add employee');
                    }
                    
                    setSuccess('Employee added successfully!');
                    setShowEmployeeModal(false);
                    fetchData();
                    setTimeout(() => setSuccess(null), 3000);
                } catch (err) {
                    setError(err.message);
                    setTimeout(() => setError(null), 5000);
                }
            };

            const deleteEmployee = async (employeeId) => {
                if (!confirm('Are you sure you want to delete this employee?')) return;
                
                try {
                    const res = await fetch(`${API_URL}/employees/${employeeId}`, {
                        method: 'DELETE'
                    });
                    
                    if (!res.ok) throw new Error('Failed to delete employee');
                    
                    setSuccess('Employee deleted successfully!');
                    fetchData();
                    setTimeout(() => setSuccess(null), 3000);
                } catch (err) {
                    setError('Failed to delete employee');
                    setTimeout(() => setError(null), 5000);
                }
            };

            const markAttendance = async (attendanceData) => {
                try {
                    const res = await fetch(`${API_URL}/attendance`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(attendanceData)
                    });
                    
                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.detail || 'Failed to mark attendance');
                    }
                    
                    setSuccess('Attendance marked successfully!');
                    setShowAttendanceModal(false);
                    fetchData();
                    setTimeout(() => setSuccess(null), 3000);
                } catch (err) {
                    setError(err.message);
                    setTimeout(() => setError(null), 5000);
                }
            };

            const filteredEmployees = employees.filter(emp =>
                emp.full_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                emp.employee_id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                emp.email.toLowerCase().includes(searchTerm.toLowerCase()) ||
                emp.department.toLowerCase().includes(searchTerm.toLowerCase())
            );

            const filteredAttendance = attendance.filter(att =>
                att.full_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                att.employee_id.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="app-container">
                    <Header currentView={currentView} setCurrentView={setCurrentView} />
                    
                    <main className="main-content">
                        {error && <div className="alert alert-error">⚠️ {error}</div>}
                        {success && <div className="alert alert-success">✓ {success}</div>}

                        {currentView === 'dashboard' && (
                            <Dashboard stats={stats} loading={loading} />
                        )}

                        {currentView === 'employees' && (
                            <Employees
                                employees={filteredEmployees}
                                loading={loading}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                onAddEmployee={() => setShowEmployeeModal(true)}
                                onDeleteEmployee={deleteEmployee}
                            />
                        )}

                        {currentView === 'attendance' && (
                            <Attendance
                                attendance={filteredAttendance}
                                loading={loading}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                onMarkAttendance={() => setShowAttendanceModal(true)}
                            />
                        )}
                    </main>

                    {showEmployeeModal && (
                        <EmployeeModal
                            onClose={() => setShowEmployeeModal(false)}
                            onSubmit={addEmployee}
                        />
                    )}

                    {showAttendanceModal && (
                        <AttendanceModal
                            employees={employees}
                            onClose={() => setShowAttendanceModal(false)}
                            onSubmit={markAttendance}
                        />
                    )}
                </div>
            );
        }

        // Header Component
        function Header({ currentView, setCurrentView }) {
            return (
                <header className="header">
                    <div className="header-content">
                        <div className="logo">
                            <div className="logo-icon">H</div>
                            <div className="logo-text">
                                <h1>HRMS Lite</h1>
                                <p>Employee Management</p>
                            </div>
                        </div>
                        <nav className="nav">
                            <button
                                className={`nav-btn ${currentView === 'dashboard' ? 'active' : ''}`}
                                onClick={() => setCurrentView('dashboard')}
                            >
                                Dashboard
                            </button>
                            <button
                                className={`nav-btn ${currentView === 'employees' ? 'active' : ''}`}
                                onClick={() => setCurrentView('employees')}
                            >
                                Employees
                            </button>
                            <button
                                className={`nav-btn ${currentView === 'attendance' ? 'active' : ''}`}
                                onClick={() => setCurrentView('attendance')}
                            >
                                Attendance
                            </button>
                        </nav>
                    </div>
                </header>
            );
        }

        // Dashboard Component
        function Dashboard({ stats, loading }) {
            if (loading) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                        <p>Loading dashboard...</p>
                    </div>
                );
            }

            if (!stats) return null;

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">Dashboard</h2>
                        <p className="page-subtitle">Overview of your HR system</p>
                    </div>

                    <div className="dashboard-grid">
                        <div className="stat-card">
                            <div className="stat-label">Total Employees</div>
                            <div className="stat-value">{stats.total_employees}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Total Records</div>
                            <div className="stat-value">{stats.total_attendance_records}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Today Present</div>
                            <div className="stat-value">{stats.today_present}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Today Absent</div>
                            <div className="stat-value">{stats.today_absent}</div>
                        </div>
                    </div>
                </div>
            );
        }

        // Employees Component
        function Employees({ employees, loading, searchTerm, setSearchTerm, onAddEmployee, onDeleteEmployee }) {
            if (loading) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                        <p>Loading employees...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">Employees</h2>
                        <p className="page-subtitle">Manage your workforce</p>
                    </div>

                    <div className="action-bar">
                        <div className="search-box">
                            <span className="search-icon">🔍</span>
                            <input
                                type="text"
                                placeholder="Search employees..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>
                        <button className="btn btn-primary" onClick={onAddEmployee}>
                            ➕ Add Employee
                        </button>
                    </div>

                    {employees.length === 0 ? (
                        <div className="empty-state">
                            <div className="empty-icon">👥</div>
                            <h3>No employees found</h3>
                            <p>Add your first employee to get started</p>
                        </div>
                    ) : (
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Employee ID</th>
                                        <th>Full Name</th>
                                        <th>Email</th>
                                        <th>Department</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {employees.map(emp => (
                                        <tr key={emp.id}>
                                            <td><strong>{emp.employee_id}</strong></td>
                                            <td>{emp.full_name}</td>
                                            <td>{emp.email}</td>
                                            <td>{emp.department}</td>
                                            <td>
                                                <button
                                                    className="btn btn-danger"
                                                    onClick={() => onDeleteEmployee(emp.employee_id)}
                                                    style={{ padding: '0.5rem 1rem', fontSize: '0.9rem' }}
                                                >
                                                    Delete
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        // Attendance Component
        function Attendance({ attendance, loading, searchTerm, setSearchTerm, onMarkAttendance }) {
            if (loading) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                        <p>Loading attendance...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">Attendance</h2>
                        <p className="page-subtitle">Track employee presence</p>
                    </div>

                    <div className="action-bar">
                        <div className="search-box">
                            <span className="search-icon">🔍</span>
                            <input
                                type="text"
                                placeholder="Search attendance..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>
                        <button className="btn btn-primary" onClick={onMarkAttendance}>
                            ✓ Mark Attendance
                        </button>
                    </div>

                    {attendance.length === 0 ? (
                        <div className="empty-state">
                            <div className="empty-icon">📅</div>
                            <h3>No attendance records</h3>
                            <p>Start marking attendance for your employees</p>
                        </div>
                    ) : (
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Employee ID</th>
                                        <th>Full Name</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {attendance.map(att => (
                                        <tr key={att.id}>
                                            <td><strong>{att.employee_id}</strong></td>
                                            <td>{att.full_name}</td>
                                            <td>{att.date}</td>
                                            <td>
                                                <span className={`badge badge-${att.status.toLowerCase()}`}>
                                                    {att.status}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        // Employee Modal Component
        function EmployeeModal({ onClose, onSubmit }) {
            const [formData, setFormData] = useState({
                employee_id: '',
                full_name: '',
                email: '',
                department: ''
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3 className="modal-title">Add New Employee</h3>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Employee ID *</label>
                                <input
                                    type="text"
                                    required
                                    value={formData.employee_id}
                                    onChange={(e) => setFormData({...formData, employee_id: e.target.value})}
                                    placeholder="e.g., EMP001"
                                />
                            </div>
                            <div className="form-group">
                                <label>Full Name *</label>
                                <input
                                    type="text"
                                    required
                                    value={formData.full_name}
                                    onChange={(e) => setFormData({...formData, full_name: e.target.value})}
                                    placeholder="e.g., John Doe"
                                />
                            </div>
                            <div className="form-group">
                                <label>Email Address *</label>
                                <input
                                    type="email"
                                    required
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                    placeholder="e.g., john@company.com"
                                />
                            </div>
                            <div className="form-group">
                                <label>Department *</label>
                                <input
                                    type="text"
                                    required
                                    value={formData.department}
                                    onChange={(e) => setFormData({...formData, department: e.target.value})}
                                    placeholder="e.g., Engineering"
                                />
                            </div>
                            <div className="form-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Add Employee
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Attendance Modal Component
        function AttendanceModal({ employees, onClose, onSubmit }) {
            const [formData, setFormData] = useState({
                employee_id: '',
                date: new Date().toISOString().split('T')[0],
                status: 'Present'
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3 className="modal-title">Mark Attendance</h3>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Employee *</label>
                                <select
                                    required
                                    value={formData.employee_id}
                                    onChange={(e) => setFormData({...formData, employee_id: e.target.value})}
                                >
                                    <option value="">Select Employee</option>
                                    {employees.map(emp => (
                                        <option key={emp.id} value={emp.employee_id}>
                                            {emp.employee_id} - {emp.full_name}
                                        </option>
                                    ))}
                                </select>
                            </div>
                            <div className="form-group">
                                <label>Date *</label>
                                <input
                                    type="date"
                                    required
                                    value={formData.date}
                                    onChange={(e) => setFormData({...formData, date: e.target.value})}
                                />
                            </div>
                            <div className="form-group">
                                <label>Status *</label>
                                <select
                                    required
                                    value={formData.status}
                                    onChange={(e) => setFormData({...formData, status: e.target.value})}
                                >
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                </select>
                            </div>
                            <div className="form-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Mark Attendance
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
